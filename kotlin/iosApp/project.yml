# iPhone uygulaması — Xcode projesi bu dosyadan üretilir (Mac'te / bulut Mac'te: xcodegen generate)
# Kotlin kodu composeApp içindeki ComposeApp.framework olarak bağlanır.
name: EhliyetOl
options:
  bundleIdPrefix: com.celikgames
  deploymentTarget:
    iOS: "16.4"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.0.0
targets:
  EhliyetOl:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: GoogleMobileAds
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Ehliyet Ol
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        # Apple takip izni penceresindeki açıklama (reklam için zorunlu)
        NSUserTrackingUsageDescription: "Reklamların sana daha uygun olması için kullanılır. İzin vermesen de uygulamanın tamamı ücretsiz çalışır."
        # Google Mobile Ads: AdMob "Ehliyet Ol iOS" uygulama kimliği (birimler Kopru.swift'te; Debug'da test birimleri)
        GADApplicationIdentifier: ca-app-pub-6396011409934303~9127568365
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.celikgames.ehliyetol
        TARGETED_DEVICE_FAMILY: "1"
        # Uygulama simgesi: Sources/Assets.xcassets/AppIcon (1024 px, köşesiz)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, ComposeApp, -ObjC]
        # Kotlin yalnız arm64 simülatör/cihaz için derlenir (Intel simülatörü yok)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # App Store imzası: profil adı testflight.sh'den gelir (PROFIL_UYGULAMA); boşsa etkisiz
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(PROFIL_UYGULAMA)
    preBuildScripts:
      - name: Kotlin çerçevesini derle
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
